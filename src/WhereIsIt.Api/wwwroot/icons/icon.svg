<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Luxury Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="40%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Radar Waves Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Pin Vibrant Gradient -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Cube Glass Surface Gradient -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)"/>
  
  <!-- Subtle Border Rim -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>

  <!-- Glowing Radar Concentric Rings -->
  <circle cx="256" cy="245" r="165" fill="none" stroke="url(#waveGrad)" stroke-width="2" stroke-dasharray="10 8" opacity="0.4"/>
  <circle cx="256" cy="245" r="125" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" opacity="0.6"/>
  <circle cx="256" cy="245" r="85" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="3"/>

  <!-- 3D Isometric Storage Container (Glassmorphic Box Base) -->
  <g transform="translate(0, 45)">
    <!-- Top Face -->
    <polygon points="256,220 376,285 256,350 136,285" fill="url(#cubeTop)" stroke="rgba(147, 197, 253, 0.5)" stroke-width="2"/>
    <!-- Left Face -->
    <polygon points="136,285 256,350 256,410 136,345" fill="url(#cubeLeft)" stroke="rgba(96, 165, 250, 0.3)" stroke-width="2"/>
    <!-- Right Face -->
    <polygon points="256,350 376,285 376,345 256,410" fill="url(#cubeRight)" stroke="rgba(167, 139, 250, 0.3)" stroke-width="2"/>
  </g>

  <!-- Glowing Cyan Beacon Aura -->
  <circle cx="256" cy="205" r="65" fill="#38BDF8" opacity="0.25" filter="url(#strongGlow)"/>

  <!-- Floating Holographic Location Pin -->
  <path d="M 256 100 C 205 100 164 141 164 192 C 164 255 256 335 256 335 C 256 335 348 255 348 192 C 348 141 307 100 256 100 Z" fill="url(#pinGrad)" filter="url(#softGlow)"/>
  
  <!-- Pin Inner Core -->
  <circle cx="256" cy="190" r="38" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="256" cy="190" r="22" fill="#1E1B4B"/>
  
  <!-- Radar Crosshair Core -->
  <circle cx="256" cy="190" r="7" fill="#38BDF8" filter="url(#softGlow)"/>

  <!-- AI Discovery Sparkle Stars -->
  <path d="M 375 110 Q 375 130 395 130 Q 375 130 375 150 Q 375 130 355 130 Q 375 130 375 110 Z" fill="url(#goldGrad)" filter="url(#softGlow)"/>
  <path d="M 130 155 Q 130 168 143 168 Q 130 168 130 181 Q 130 168 117 168 Q 130 168 130 155 Z" fill="#38BDF8" opacity="0.85"/>
</svg>
