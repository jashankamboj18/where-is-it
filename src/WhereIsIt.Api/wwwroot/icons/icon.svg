<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="230" r="150" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-dasharray="16 12"/>
  <circle cx="256" cy="230" r="115" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="6"/>
  
  <!-- Central Glowing Finder AI Orb -->
  <circle cx="256" cy="230" r="80" fill="url(#orbGrad)" filter="url(#glow)"/>
  
  <!-- Location Pin Shape -->
  <path d="M 256 140 C 210 140 174 176 174 222 C 174 278 256 350 256 350 C 256 350 338 278 338 222 C 338 176 302 140 256 140 Z" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="256" cy="216" r="32" fill="url(#bgGrad)"/>
  
  <!-- Search Sparkle Star -->
  <path d="M 370 120 Q 370 145 395 145 Q 370 145 370 170 Q 370 145 345 145 Q 370 145 370 120 Z" fill="#FACC15" filter="url(#glow)"/>
  
  <!-- App Label Banner / Base -->
  <rect x="96" y="390" width="320" height="60" rx="30" fill="rgba(15, 23, 42, 0.75)"/>
  <text x="256" y="430" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" text-anchor="middle" letter-spacing="4">FINDER AI</text>
</svg>
